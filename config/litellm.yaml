# LiteLLM proxy settings (SPEC §6.2).
#
# No model_list here: since M1a, LiteLLM's DB (STORE_MODEL_IN_DB=True) is the single source of truth
# for routable models, and the Router API is its only writer. Aliases are declared in
# config/providers.yaml (`aliases:`) and reconciled into LiteLLM with provider keys stored as
# LiteLLM credentials. See docs/m1a.md for the reasoning.

router_settings:
  # fast: Groq (order 1) -> Cerebras (order 2, if keyed) -> smart-free.
  # smart-free -> local. local/private/local-code never fall back (never leave the machine).
  fallbacks:
    - fast: ["smart-free"]
    - smart-free: ["local"]
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 60
  # Deployments sharing an alias are grouped by `order`: the lowest order is used first and LiteLLM
  # retries the next order on failure (verified on v1.108.8).

litellm_settings:
  drop_params: true
  # Global ceiling; per-deployment timeouts (fast: 25 s) are set by the router.
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
