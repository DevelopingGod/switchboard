# Provider registry (SPEC §6, §6.4, §8f). Read by the Router API (services/router).
# Free limits are seeded from cheahjs/free-llm-api-resources (Nov 2026) — verify in each console.
# privacy: no-training | may-train | local | varies
#
# API keys are never stored here. They are added through the Router API (encrypted in the Router DB
# and registered as a LiteLLM credential). `env_key` names the deploy/.env variable imported once
# on first start, if set.

providers:
  groq:
    kind: api_key
    name: Groq
    base_url: https://api.groq.com/openai/v1
    catalog: openai          # GET {base_url}/models, Bearer auth
    litellm_prefix: groq
    env_key: GROQ_API_KEY
    free_tier: true          # M2: cost_usd 0, list price kept as list_price_usd
    privacy: no-training
    free_limits: "~30 req/min, 1k–14.4k req/day per model"
    notes: Groq states no training on API data.

  gemini:
    kind: api_key
    name: Google AI Studio (Gemini)
    base_url: https://generativelanguage.googleapis.com/v1beta
    catalog: gemini          # GET {base_url}/models, x-goog-api-key header
    litellm_prefix: gemini
    env_key: GEMINI_API_KEY
    free_tier: true          # AI Studio free tier
    privacy: may-train
    free_limits: "Flash: ~10 req/min, ~250 req/day; Flash-Lite higher"
    notes: Free tier may train on data outside EEA/UK/CH.

  cerebras:
    kind: api_key
    name: Cerebras
    base_url: https://api.cerebras.ai/v1
    catalog: openai
    litellm_prefix: cerebras
    env_key: CEREBRAS_API_KEY
    # One-time free credits, not a renewing free tier. Spend is tracked against a starting balance
    # you enter on the card (list price of each call); routing stops when it reaches $0.
    # Kept `kind: api_key` so key storage, catalog and LiteLLM registration work unchanged.
    billing: credits
    free_tier: true          # calls cost you $0, so they never count toward the daily cap
    privacy: no-training
    free_limits: "One-time free credits (no renewing free tier); enter your starting balance"
    notes: Credits run out. The card shows what is left; routing stops at $0.

  mistral:
    kind: api_key
    name: Mistral (La Plateforme)
    base_url: https://api.mistral.ai/v1
    catalog: openai
    litellm_prefix: mistral
    env_key: MISTRAL_API_KEY
    paid: true               # the free plan cannot activate API keys: a paid plan is required
    privacy: may-train
    free_limits: "None: the free plan cannot activate API keys (paid plan required)"
    notes: Paid plan required. Hidden from the free presets and the wizard. May train on data unless opted out.

  openrouter:
    kind: api_key
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    catalog: openrouter
    litellm_prefix: openrouter
    env_key: OPENROUTER_API_KEY
    free_tier: ":free"       # only model ids ending in ":free"
    privacy: varies
    free_limits: "`:free` models: 20 req/min, 50 req/day (1000/day after $10 credit)"
    notes: Only `:free` models are used automatically. A paid model is used only when you pick it by hand.

  opencode-zen:
    kind: api_key
    name: OpenCode Zen
    base_url: https://opencode.ai/zen/v1
    chat_base_url: https://opencode.ai/zen/v1
    catalog: zen
    litellm_prefix: openai   # OpenAI-compatible; api_base set per deployment
    env_key: OPENCODE_ZEN_API_KEY
    privacy: varies
    free_limits: "Rotating free models (e.g. Big Pickle, *-free); limits per model"
    notes: Some free models may use your data to improve the model.

  xai:
    kind: api_key
    name: xAI (Grok API)
    base_url: https://api.x.ai/v1
    catalog: openai          # GET {base_url}/models, Bearer auth
    litellm_prefix: xai
    env_key: XAI_API_KEY
    paid: true
    privacy: varies
    free_limits: "Paid, pay per token / image / second. No free tier."
    notes: Optional. Text, plus Imagine image and video generation (M5).

  ollama:
    kind: local
    name: Ollama (local)
    base_url_env: OLLAMA_API_BASE
    catalog: ollama
    litellm_prefix: ollama_chat
    free_tier: true
    privacy: local
    free_limits: "Unlimited (your GPU: ≤ ~4B params at Q4)"

  claude-code:
    kind: cli
    name: Claude Code
    bin: claude
    privacy: varies
    paid: true
    login_hint: "claude  (then /login in the browser)"
    notes: Claude Pro subscription; official CLI only.

  codex:
    kind: cli
    name: Codex CLI
    bin: codex
    privacy: varies
    login_hint: codex login

  gemini-cli:
    kind: cli
    name: Gemini CLI
    bin: gemini
    privacy: may-train
    # Google sign-in is no longer supported for individuals: use an API key.
    login_hint: "gemini  (choose Use Gemini API key, not Google sign-in; create a key at aistudio.google.com/apikey)"
    notes: Google sign-in no longer works for individuals. Shares the Gemini API free quota with smart-free, so CLI use eats into it.

  grok-build:
    kind: cli
    name: Grok Build
    bin: grok
    privacy: varies
    paid: true
    login_hint: grok auth login
    notes: Beta. Headless use may bill an xAI API key — verify before routing jobs (SPEC §12).

  opencode:
    kind: cli
    name: OpenCode
    bin: opencode
    privacy: varies
    login_hint: opencode auth login

# First-run wizard (SPEC §8b): which providers each goal needs. Goal ids are labelled in the portal
# (strings.ts); this file only decides the mapping. Providers marked `paid: true` are labelled so.
goals:
  chat: [groq, cerebras]
  writing: [gemini, openrouter]
  code: [claude-code, codex, grok-build, opencode, opencode-zen]
  research: [gemini]
  images: [gemini, xai]
  video: [xai]
  private: [ollama]

# LiteLLM aliases (SPEC §6.2). The router reconciles these into LiteLLM's DB (the single source of
# truth for routable models, see docs/m1a.md). A deployment is registered only when its provider
# has a key (or is local). Deployments sharing an alias are tried by `order` (1 first).
aliases:
  fast:
    - { provider: groq, model: openai/gpt-oss-120b, order: 1, timeout: 25 }
    - { provider: cerebras, model: gpt-oss-120b, order: 2, timeout: 25 }
  cerebras:
    - { provider: cerebras, model: gpt-oss-120b, timeout: 25 }
  smart-free:
    # Pinned after a sweep of every chat-capable Gemini model (2026-11-17, scripts/gemini-sweep.py,
    # docs/m1b.md): gemini-3.5-flash (the old pin) answered 0/3 (timeout, then 503 "overloaded");
    # gemini-3.1-flash-lite answered 3/3 at ~1.2 s and is not a preview model. Stronger alternative
    # that also went 3/3: gemini-3-flash-preview (a preview, so it may be retired).
    # num_retries 0 + 30 s: a failing Gemini call reaches the `local` fallback after one timeout.
    - { provider: gemini, model: gemini-3.1-flash-lite, timeout: 30, num_retries: 0 }
  general:
    - { provider: mistral, model: mistral-small-latest, timeout: 60 }
  explore:
    - { provider: openrouter, model: "openai/gpt-oss-120b:free", timeout: 60 }
  code-free:
    - { provider: opencode-zen, model: big-pickle, timeout: 90 }
  local:
    - { provider: ollama, model: "qwen3:4b" }
  private:
    - { provider: ollama, model: "qwen3:4b" }
  local-code:
    - { provider: ollama, model: "qwen2.5-coder:3b" }
