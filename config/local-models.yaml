# Local-model profiles (M3a). Switchboard runs on many machines, so nothing is tied to one GPU:
# setup and doctor detect the GPU memory (nvidia-smi through hostprobe) and pick a profile; you can
# change it in Settings → Local models. The active profile decides:
#   classifier  Arch-Router model for intent routing (null = keyword heuristics only)
#   general     the `local` / `private` aliases (private chats, last-resort fallback). A model that
#               answers without a thinking phase, so local replies start at once (M4a, ADR 0006)
#   thinker     "Think harder" (`local-think`): a model that reasons first, used only when asked for
#               one message (null = `general`). Slower: on a small GPU it also swaps with `general`
#   tasks       titles and long-thread summaries (null = a free cloud model, never for private threads)
#   coder       the `local-code` alias (null = `general`)
# `max_loaded` is how many models may hold GPU memory at once (a model pinned to the CPU with
# `num_gpu: 0` doesn't count). The router unloads GPU models beyond it, never the classifier.
#   classifier_options   extra Ollama options for the classifier, e.g. { num_gpu: 0 } = run on the CPU
#   tasks_options        the same for the tasks model (titles, summaries)
#   tasks_keep_alive     how long the tasks model stays loaded (Ollama duration, or -1 = forever)
#
# Small GPUs (M3b, ADR 0002): on 4 GB the classifier (1.1 GB), the chat model (qwen3:4b, 3.4 GB) and the
# tasks model never fit together and Ollama swaps them by memory whatever keep_alive says (docs/m3a.md).
# So `small` runs the classifier and the tasks model on the CPU with a long keep_alive and leaves the
# GPU to the chat model alone: nothing swaps and the classifier is always loaded. The tasks model and the
# classifier share CPU cores, so background jobs run one at a time and wait for any classification
# (app/local_queue.py). Larger GPUs keep everything on the GPU.

arch_router: &arch hf.co/katanemo/Arch-Router-1.5B.gguf:Q4_K_M

profiles:
  none:
    label: CPU only / under 4 GB
    min_vram_gb: 0
    classifier: null
    general: llama3.2:3b         # runs on CPU here: private replies are slow
    thinker: null                # "Think harder" uses the general model (no thinking model on CPU)
    tasks: null
    coder: null
    vision: null                 # M2.5: no local image reading on CPU only (a private image gets a clear message)
    cpu: true
    max_loaded: 1
  small:
    label: 4–6 GB GPU
    min_vram_gb: 4
    classifier: *arch
    # M4a (ADR 0006, measured on an RTX 3050 4 GB): qwen3:4b thinks before every answer, so the first
    # word took a median 31 s (worst 268 s). With thinking off it writes the reasoning into the answer
    # instead (9 of 10), so it isn't faster. The 2507 instruct build never thinks: first word 0.2 s,
    # whole answer 7.5 s, same answer quality. qwen3:4b stays for "Think harder".
    general: qwen3:4b-instruct-2507-q4_K_M
    thinker: qwen3:4b
    # Titles and summaries: llama3.2:3b. qwen3:4b was the plan, but it writes its reasoning into the
    # answer even with think:false ("Okay, the user wants me to...", verified 2026-11-18, docs/m3a.md),
    # so every title fell back to the first words.
    tasks: llama3.2:3b
    coder: null
    # M2.5: images in private chats. Measured on a 4 GB RTX 3050 (docs/m25.md): 2.3 GB, 82% on the GPU, 5/5 on
    # the image checks, ~2 s per image once loaded; swaps with the chat model, so the first reply is slower.
    # Pulled only when you ask (Settings → Local models), never by setup.
    vision: qwen3-vl:2b
    classifier_options: { num_gpu: 0 }
    tasks_options: { num_gpu: 0 }
    tasks_keep_alive: 1h
    max_loaded: 1            # the chat model alone holds the GPU
  medium:
    label: 8–12 GB GPU
    min_vram_gb: 8
    classifier: *arch
    general: qwen3:4b-instruct-2507-q4_K_M   # fits fully in GPU memory here (not measured on 8 GB)
    thinker: qwen3:8b
    tasks: llama3.2:3b
    coder: null
    vision: gemma3:4b            # 5/5 on the image checks; not measured on 8 GB (on 4 GB only 46% fits the GPU)
    max_loaded: 2
  large:
    label: 16 GB+ GPU
    min_vram_gb: 16
    classifier: *arch
    general: qwen3:4b-instruct-2507-q4_K_M   # not measured on 16 GB; pick a larger non-thinking model in Settings
    thinker: qwen3:14b
    tasks: llama3.2:3b
    coder: qwen2.5-coder:14b
    vision: gemma3:4b            # not measured on 16 GB; a larger vision model can be set here
    max_loaded: 2

# Used when detection fails (no NVIDIA GPU visible, hostprobe down) until you pick one in Settings.
fallback: small
