# Switchboard infra: Postgres + LiteLLM (M0), Router API (M1a).
# Paperclip and hostprobe run natively in WSL (see scripts/setup-wsl.sh); Ollama runs on Windows.
# Everything is bound to 127.0.0.1 (SPEC §13.1).

name: switchboard

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17.6}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-switchboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: switchboard
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d switchboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-v1.108.8}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in deploy/.env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in deploy/.env}
      STORE_MODEL_IN_DB: "True"
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    volumes:
      # Mount the directory, not the file: editors replace files atomically and a
      # single-file bind mount keeps pointing at the old inode.
      - ../config:/app/config:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  router:
    build: ../services/router
    image: switchboard-router:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD}@postgres:5432/switchboard
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      SWITCHBOARD_SECRET_KEY: ${SWITCHBOARD_SECRET_KEY:?set SWITCHBOARD_SECRET_KEY in deploy/.env (scripts/setup-wsl.sh)}
      ROUTER_ADMIN_TOKEN: ${ROUTER_ADMIN_TOKEN:?set ROUTER_ADMIN_TOKEN in deploy/.env (scripts/setup-wsl.sh)}
      HOSTPROBE_URL: http://host.docker.internal:${HOSTPROBE_PORT:-8101}
      HOSTPROBE_TOKEN: ${HOSTPROBE_TOKEN:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # Paperclip runs natively in WSL on loopback; the container reaches it via host.docker.internal
      # (health dot in the portal footer / Status view only).
      PAPERCLIP_URL: http://host.docker.internal:${PAPERCLIP_PORT:-3100}
      CONFIG_DIR: /srv/config
      # Dev only, off unless you export it for one run: lets a chat request force a 429/timeout on a
      # target to check fallbacks live (docs/m2.md). Never set it in deploy/.env.
      ROUTER_FAULT_INJECTION: ${ROUTER_FAULT_INJECTION:-false}
      # Dev only, like fault injection: low free limits to demo the quota guard (docs/m3a.md), e.g.
      # ROUTER_QUOTA_TEST_LIMITS="groq:openai/gpt-oss-120b=rpd:3". Never set it in deploy/.env.
      ROUTER_QUOTA_TEST_LIMITS: ${ROUTER_QUOTA_TEST_LIMITS:-}
      # Imported once into the encrypted store on first start (docs/m1a.md).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
    volumes:
      - ../config:/srv/config:ro
    ports:
      - "127.0.0.1:${ROUTER_PORT:-8100}:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
